version: '3.8'

services:
  backend:
    build: .
    container_name: orderbook-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    command: sh -c "cd build && ./orderbook_server"
    restart: unless-stopped

  feeder:
    build: .
    container_name: orderbook-feeder
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8080 
    command: node depthFeed.js
    restart: unless-stopped