<!DOCTYPE html>
<html>
<head>
<title>Live Order Book — Paper Trading</title>
<style>
  body { margin:0; padding:20px; background:#0f1117; color:#d1d4dc; font-family: 'Courier New', monospace; }
  h1 { font-size: 16px; font-weight: normal; color: #888; }
  .mid { font-size: 40px; font-weight: bold; margin: 10px 0 20px; color: #fff; }
  .book { display: flex; gap: 20px; max-width: 700px; }
  .side { flex: 1; }
  .side h2 { font-size: 13px; text-transform: uppercase; margin-bottom: 6px; }
  .bids h2 { color: #26a69a; }
  .asks h2 { color: #ef5350; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 3px 6px; }
  .bids td.price { color: #26a69a; }
  .asks td.price { color: #ef5350; }
  td.qty { text-align: right; color: #888; }
  .status { font-size: 12px; color: #555; margin-top: 20px; }
  .status.connected { color: #26a69a; }
  .status.disconnected { color: #ef5350; }
</style>
</head>
<body>
  <h1>BTC/USDT — Live Paper Trading Book</h1>
  <div class="mid" id="midprice">--</div>
  <div class="book">
    <div class="side bids">
      <h2>Bids</h2>
      <table id="bidsTable"></table>
    </div>
    <div class="side asks">
      <h2>Asks</h2>
      <table id="asksTable"></table>
    </div>
  </div>
  <div class="status disconnected" id="status">connecting...</div>

<script>
function fmtPrice(cents) { return '$' + (cents / 100).toFixed(2); }
function fmtQty(q) { return (q / 100000).toFixed(4); }

function render(bids, asks) {
  const bidsHtml = bids.map(b =>
    `<tr><td class="price">${fmtPrice(b.price)}</td><td class="qty">${fmtQty(b.quantity)}</td></tr>`
  ).join('');
  const asksHtml = asks.slice().reverse().map(a =>
    `<tr><td class="price">${fmtPrice(a.price)}</td><td class="qty">${fmtQty(a.quantity)}</td></tr>`
  ).join('');
  document.getElementById('bidsTable').innerHTML = bidsHtml;
  document.getElementById('asksTable').innerHTML = asksHtml;
}

function connect() {
  const ws = new WebSocket('ws://localhost:8080/ws');
  const statusEl = document.getElementById('status');

  ws.onopen = () => {
    statusEl.textContent = 'connected — live';
    statusEl.className = 'status connected';
  };

  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      document.getElementById('midprice').textContent = fmtPrice(data.midPrice);
      render(data.bids || [], data.asks || []);
    } catch (e) {
      console.error('bad message', e);
    }
  };

  ws.onclose = () => {
    statusEl.textContent = 'disconnected — retrying...';
    statusEl.className = 'status disconnected';
    setTimeout(connect, 1500);
  };

  ws.onerror = () => ws.close();
}

connect();
</script>
</body>
</html>
